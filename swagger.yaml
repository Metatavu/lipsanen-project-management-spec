openapi: 3.0.3
info:
  version: 1.0.0
  title: Lipsanen Project Management API

security:
  - bearerAuth: []

paths:
  /v1/system/ping:
    get:
      operationId: ping
      summary: Replies with pong
      description: Replies ping with pong
      tags:
        - System
      responses:
        "200":
          description: Pong
          content:
            text/plain:
              schema:
                type: string

  /v1/projects/import:
    post:
      operationId: importXml
      summary: Import XML file from Aikataulu
      description: Import XML file from Aikataulu
      tags:
        - Projects
      requestBody:
        content:
          application/xml:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Imported project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "default":
          description: Invalid request was sent to the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/projects:
    get:
      operationId: listProjects
      summary: Get all projects
      description: Get all projects
      tags:
        - Projects
      parameters:
        - name: first
          in: query
          description: First result.
          schema:
            type: integer
        - name: max
          in: query
          description: Max results.
          schema:
            type: integer
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        "default":
          description: Invalid request was sent to the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProject
      summary: Create a new project
      description: Create a new project
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "default":
          description: Invalid request was sent to the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/projects/{projectId}:
    get:
      operationId: findProject
      summary: Get a project
      description: Get a project
      tags:
        - Projects
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project
          content:
            application/json:
