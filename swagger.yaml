components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      description: Error object
      required:
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
          
    ProjectStatus:
      type: string
      description: Project status
      enum:
        - INITIATION
        - PLANNING
        - DESIGN
        - PROCUREMENT
        - CONSTRUCTION
        - INSPECTION
        - COMPLETION

    Project:
      type: object
      description: Project object
      required:
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tocomanId:
          type: integer
        status:
          $ref: '#/components/schemas/ProjectStatus'
        metadata:
          $ref: '#/components/schemas/Metadata'

    User:
      type: object
      description: User object
      required:
        - firstName
        - lastName
        - email
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        companyId:
          format: uuid
          type: string
        lastLoggedIn:
          format: date-time
          type: string
        projectIds:
          description: List of project ids that the user belongs to
          type: array
          items:
            type: string
            format: uuid

    Company:
      type: object
      description: Company object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    ProjectTheme:
      type: object
      description: Theme object
      required:
        - themeColor
        - logoUrl
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        themeColor:
          type: string
          description: Theme color code
        logoUrl:
          type: string
          format: url
        metadata:
          $ref: '#/components/schemas/Metadata'

    Milestone:
      type: object
      description: milestone
      required:
        - name
        - startDate
        - endDate
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        startDate:
          format: date
          type: string
        endDate:
          format: date
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'


    Task:
      type: object
      description: milestone
      required:
        - name
        - startDate
        - endDate
        - milestoneId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        startDate:
          format: date
          type: string
          description: Can be edited only within proposal OR in project planning stage by admin
        endDate:
          format: date
          type: string
          description: Can be edited only within proposal OR in project planning stage by admin
        milestoneId:
          type: string
          format: uuid
        sourceConnections:
          type: array
          items:
            $ref: '#/components/schemas/TaskConnection'
          description: Connections of this task where it acts as the source, can be edited in project planning stage by admin
        targetConnections:
          type: array
          items:
            $ref: '#/components/schemas/TaskConnection'
          description: Connections of this task where it acts as the target, can be edited in project planning stage by admin
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Task status. TaskConnections is taken into account when updating the status
        metadata:
          $ref: '#/components/schemas/Metadata'

    TaskStatus:
      type: string
      description: Task status
      enum:
        - NOT_STARTED
        - IN_PROGRESS
        - DONE

    TaskConnection:
      type: object
      description: Task connection
      required:
        - sourceTaskId
        - targetTaskId
        - type
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sourceTaskId:
          type: string
          format: uuid
        targetTaskId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TaskConnectionType'
        metadata:
          $ref: '#/components/schemas/Metadata'

    TaskConnectionType:
      type: string
      description: Task connection type
      enum:
        - FINISH_TO_START
        - START_TO_START

    Metadata:
      type: object
      description: Error object
      properties:
        creatorId:
          type: string
          readOnly: true
          format: uuid
        createdAt:
          format: date-time
          type: string
          readOnly: true
        lastModifierId:
          type: string
          readOnly: true
          format: uuid
        modifiedAt:
          format: date-time
          type: string
          readOnly: true
