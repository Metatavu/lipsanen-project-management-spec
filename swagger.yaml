components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      description: Error object
      required:
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string

    ProjectStatus:
      type: string
      description: Project status
      enum:
        - INITIATION
        - PLANNING
        - DESIGN
        - PROCUREMENT
        - CONSTRUCTION
        - INSPECTION
        - COMPLETION

    Project:
      type: object
      description: Project object
      required:
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tocomanId:
          type: integer
        status:
          $ref: '#/components/schemas/ProjectStatus'
        metadata:
          $ref: '#/components/schemas/Metadata'

    User:
      type: object
      description: User object
      required:
        - firstName
        - lastName
        - email
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        companyId:
          format: uuid
          type: string
        lastLoggedIn:
          format: date-time
          type: string
        projectIds:
          description: List of project ids that the user belongs to
          type: array
          items:
            type: string
            format: uuid
        roles:
          description: User roles, can be empty or filled if includeRoles pameter is used. Defines the access level of the user.
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        jobPositionId:
          description: List of job positions that the user has
          type: string
          format: uuid

    JobPosition:
      type: object
      description: User's position in the company
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        color:
          type: string
        iconName:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    UserRole:
      type: string
      description: Access role of the user
      enum:
        - ADMIN
        - USER

    Company:
      type: object
      description: Company object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    ProjectTheme:
      type: object
      description: Theme object
      required:
        - themeColor
        - logoUrl
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        themeColor:
          type: string
          description: Theme color code
        logoUrl:
          type: string
          format: url
        metadata:
          $ref: '#/components/schemas/Metadata'

    Milestone:
      type: object
      description: milestone
      required:
        - name
        - startDate
        - endDate
        - originalStartDate
        - originalEndDate
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        startDate:
          format: date
          type: string
        endDate:
          format: date
          type: string
        originalStartDate:
          format: date
          type: string
          description: Original start date of the milestone
        originalEndDate:
          format: date
          type: string
          description: Original end date of the milestone
        estimatedReadiness:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Estimated readiness of the milestone
        metadata:
          $ref: '#/components/schemas/Metadata'

    Task:
      type: object
      description: milestone
      required:
        - name
        - startDate
        - endDate
        - milestoneId
        - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        startDate:
          format: date
          type: string
          description: Can be edited only within proposal OR in project planning stage by admin
        endDate:
          format: date
          type: string
          description: Can be edited only within proposal OR in project planning stage by admin
        milestoneId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Task status. TaskConnections is taken into account when updating the status
        assigneeIds:
          type: array
          items:
            type: string
            format: uuid
          description: List of assignee user IDs
        userRole:
          $ref: '#/components/schemas/UserRole'
          description: User role suggested for the task
        jobPositionId:
          type: string
          format: uuid
          description: Job title suggested for the task
        estimatedDuration:
          type: number
          format: float
          description: Estimated duration of the task in days
        estimatedReadiness:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Estimated readiness of the task
        attachmentUrls:
          type: array
          items:
            type: string
            format: url
          description: URLs of attachments related to the task
        metadata:
          $ref: '#/components/schemas/Metadata'

    TaskStatus:
      type: string
      description: Task status
      enum:
        - NOT_STARTED
        - IN_PROGRESS
        - DONE

    ChangeProposal:
      type: object
      description: Change proposal
      required:
        - status
        - taskId
        - reason
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        taskId:
          type: string
          format: uuid
        startDate:
          description: Null if change is not needed and not null if the start date is proposed to change
          format: date
          type: string
        endDate:
          description: Null if change is not needed and not null if the end date is proposed to change
          format: date
          type: string
        reason:
          type: string
          description: The reason for the proposed change
        comment:
          type: string
          description: Additional comments or details about the proposed change
        status:
          $ref: '#/components/schemas/ChangeProposalStatus'
          description: Status of the change proposal
        metadata:
          $ref: '#/components/schemas/Metadata'

    ChangeProposalStatus:
      type: string
      description: Change proposal status
      enum:
        - PENDING
        - APPROVED
        - REJECTED


    TaskConnection:
      type: object
      description: Task connection
      required:
        - sourceTaskId
        - targetTaskId
        - type
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sourceTaskId:
          type: string
          format: uuid
        targetTaskId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TaskConnectionType'

    TaskConnectionRole:
      type: string
      description: Role of the task in the connection
      enum:
        - SOURCE
        - TARGET

    TaskConnectionType:
      type: string
      description: Task connection type
      enum:
        - FINISH_TO_START
        - START_TO_START
        - FINISH_TO_FINISH

    Notification:
      type: object
      description: Notification object that is created upon an event and sent to multiple users
      required:
        - message
        - type
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        message:
          description: notification message
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        taskId:
          description: ID of the subject entity of the notification if applicable, depends on the notification type
          type: string
          format: uuid
        commentId:
          description: ID of the comment entity of the notification if applicable, depends on the notification type
          type: string
          format: uuid

    NotificationEvent:
      type: object
      description: Received notification by a user
      required:
        - notification
        - receiverId
        - read
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        notification:
          description: Full notification object
          $ref: '#/components/schemas/Notification'
        receiverId:
          description: User ID that the notification was sent to
          type: string
          format: uuid
        read:
          description: Whether the notification has been read
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'

    NotificationType:
      type: string
      description: Notification type
      enum:
        - TASK_ASSIGNED
        - TASK_STATUS_CHANGED
        - CHANGE_PROPOSAL_CREATED
        - CHANGE_PROPOSAL_STATUS_CHANGED
        - COMMENT_LEFT

    TaskComment:
      type: object
      description: Task comment
      required:
        - taskId
        - comment
        - referencedUsers
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        taskId:
          type: string
          format: uuid
        referencedUsers:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of users that the comment affects
        comment:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    Metadata:
      type: object
      description: Error object
      properties:
        creatorId:
          type: string
          readOnly: true
          format: uuid
        createdAt:
          format: date-time
          type: string
          readOnly: true
        lastModifierId:
          type: string
          readOnly: true
          format: uuid
        modifiedAt:
          format: date-time
          type: string
          readOnly: true
